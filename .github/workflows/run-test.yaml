name: Run unit tests

on: [push]

permissions:
  contents: read

jobs:
  test-legacy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['2.7', '3.5', '3.6']
    container:
      image: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tox (legacy)
        run: |
          python -m pip install --upgrade pip
          pip install 'tox<3'
      - name: Test with tox
        run: |
          python -m tox -e py$(echo ${{ matrix.python-version }} | tr -d .)

  test-modern:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.7', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (cache service v2)
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-tests.txt', '**/requirements-tests-modern.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install tox (modern)
        run: |
          python -m pip install --upgrade pip
          pip install 'tox>=4' tox-gh-actions
      - name: Test with tox
        run: |
          tox
